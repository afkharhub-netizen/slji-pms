<style>
:root{
  color-scheme:light;
  --navy:#0F2F5E; --navy-2:#14407F; --blue:#1D4E9A; --blue-2:#2F66B8;
  --sky:#E6EEF9; --mist:#F3F6FB; --line:#D3DCEA; --line-2:#9FB0CB;
  --ink:#14213A; --ink-2:#4A5A78; --white:#FFFFFF;
  --orange:#D9651B; --orange-d:#B9500F; --orange-bg:#FCEBDD;
  --green:#1B7A4B; --green-bg:#DFF2E7; --amber:#8A5F00; --amber-bg:#FBEFCF; --red:#B3261E; --red-bg:#F9E0DE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{background:var(--navy);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;min-height:100vh}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{margin:0;line-height:1.25;color:var(--navy)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:block}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fff}
.login-hero{background:var(--navy);color:#fff;padding:56px 56px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login-hero h1{color:#fff;font-size:36px;max-width:16ch}
.login-hero p{color:#C9D6EC;max-width:38ch;margin-top:14px;font-size:18px}
.login-facts{display:grid;gap:12px;color:#C9D6EC;font-size:15px}
.login-facts div{display:flex;gap:10px;align-items:center}
.login-panel{display:grid;place-items:center;padding:32px 20px;background:#fff}
.login-card{width:100%;max-width:400px;animation:rise .35s ease-out}
.login-card h2{font-size:26px;margin-bottom:6px}
.login-card .field{margin-top:16px}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:64px}
.pw-toggle{position:absolute;right:4px;top:4px;height:36px;padding:0 12px;background:#fff;border:0;color:var(--blue);font-weight:700;border-radius:6px}
.err{color:var(--red);font-weight:700;min-height:24px;margin-top:12px}
.demo{margin-top:28px;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--mist)}
.demo h3{font-size:15px;margin-bottom:4px}
.demo p{font-size:14px;color:var(--ink-2)}
.demo .chips{margin-top:10px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#fff;flex:none}
.brand-lg img{width:84px;height:84px;border-radius:14px}
.brand-lg b{font-size:26px}
.brand-lg span{font-size:15px}
@media(max-width:860px){.brand-lg img{width:60px;height:60px}.brand-lg b{font-size:22px}}
.brand b{display:block;font-size:22px;letter-spacing:.5px;line-height:1.1}
.brand span{display:block;font-size:13px;color:#C9D6EC}
@media(max-width:860px){
  .login{grid-template-columns:1fr}
  .login-hero{padding:28px 22px 56px;gap:18px;clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}
  .login-hero h1{font-size:26px}
  .login-hero p{font-size:16px;margin-top:8px}
  .login-facts{display:none}
  .login-panel{padding:8px 20px 40px;align-items:start}
}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:76px 1fr;min-height:100vh;transition:grid-template-columns .18s ease}
@media(min-width:901px){
  .shell:has(.side:hover){grid-template-columns:256px 1fr}
  .side .brand{overflow:hidden}
  .side .brand b,.side .brand span{opacity:0;transition:opacity .12s;white-space:nowrap}
  .shell:has(.side:hover) .side .brand b,.shell:has(.side:hover) .side .brand span{opacity:1}
  .nav-item{overflow:hidden}
  .nav-item span{opacity:0;transition:opacity .12s;white-space:nowrap}
  .shell:has(.side:hover) .nav-item span{opacity:1}
  .side{width:100%}
}
.side{background:var(--navy);color:#fff;position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px}
.side .brand{padding:0 8px 22px;border-bottom:1px solid var(--navy-2)}
.nav{display:grid;gap:4px;margin-top:18px}
.nav-item{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:#C9D6EC;text-align:left;transition:background .15s,color .15s}
.nav-item:hover{background:var(--navy-2);color:#fff}
.nav-item.on{background:#fff;color:var(--navy);font-weight:700}
.side-foot{margin-top:auto}
.syncind{display:flex;align-items:center;gap:8px;font-size:12px;color:#C9D6EC;padding:6px 10px;margin-bottom:10px;border-radius:8px;background:var(--navy-2)}
.syncind .dot{width:8px;height:8px;border-radius:50%;background:#9FB0CB;flex:none}
.syncind.ok .dot{background:#3DDC84}
.syncind.err .dot{background:#FF6B5E}
.syncind.wait .dot{background:#F5C33B;animation:pulse 1.2s ease-in-out infinite}
.syncind.off .dot{background:#9FB0CB}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.col{min-width:0}
.main{padding:30px 38px 56px;max-width:1260px}
.top{display:none}
.tabbar{display:none}
.menu-wrap{position:relative}
.userbtn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:8px;background:var(--navy-2);color:#fff;text-align:left}
.userbtn:hover{background:#1A4C93}
.userbtn small{display:block;color:#C9D6EC;font-size:13px;line-height:1.2}
.userbtn b{display:block;line-height:1.2;font-size:15px}
.avatar{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.menu{position:absolute;z-index:40;min-width:220px;background:#fff;color:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:6px;clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path .17s ease,visibility 0s .17s}
.menu.up{bottom:calc(100% + 8px);left:0;right:0;clip-path:inset(100% 0 0 0)}
.menu.down{top:calc(100% + 8px);right:0}
.menu-wrap.open .menu{clip-path:inset(0);visibility:visible;transition:clip-path .17s ease}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:6px;background:#fff;text-align:left}
.menu-item:hover{background:var(--sky)}
.menu-meta{padding:8px 12px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu-meta b{display:block}
.menu-meta small{color:var(--ink-2)}

.page{animation:none}
.enter{animation:enter .24s ease-out}
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.page-head h1{font-size:30px}
.page-head p{color:var(--ink-2);margin-top:4px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.lock-note{display:flex;gap:8px;align-items:center;color:var(--ink-2);font-size:14px;margin-top:6px}

@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .top{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:58px;align-items:center;justify-content:space-between;padding:0 14px;background:var(--navy);color:#fff}
  .top .brand img{width:34px;height:34px}
  .top .brand b{font-size:18px}
  .top .brand span{display:none}
  .top .avatar{width:38px;height:38px;border:0}
  .main{padding:20px 16px 108px}
  .page-head h1{font-size:25px}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line-2);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;padding:6px 2px;border:0;border-top:4px solid #fff;background:#fff;color:var(--ink-2);font-size:12px}
  .tab.on{color:var(--blue);border-top-color:var(--blue);font-weight:700}
}

/* ---------- components ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}
.card + .card{margin-top:0}
.card-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-h h2{font-size:19px}
.card-h p{font-size:14px;color:var(--ink-2);flex-basis:100%}
.stack{display:grid;gap:18px}
.g2,.g3,.g4,.g5{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.g4,.g5{grid-template-columns:1fr 1fr;gap:10px}}

.kpi{padding:16px}
.kpi-l{font-size:14px;color:var(--ink-2)}
.kpi-v{font-size:32px;font-weight:700;color:var(--navy);line-height:1.15;margin-top:4px}
.kpi-s{font-size:13px;color:var(--ink-2);margin-top:4px}
.kpi-b{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px}
.kpi.orange{border-color:var(--orange);background:var(--orange-bg)}
.kpi.orange .kpi-v{color:var(--orange-d)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;line-height:1.5;white-space:nowrap}
.p-ok{background:var(--green-bg);color:var(--green)}
.p-blue{background:var(--sky);color:var(--blue)}
.p-warn{background:var(--amber-bg);color:var(--amber)}
.p-bad{background:var(--red-bg);color:var(--red)}
.p-mute{background:#E9EDF4;color:var(--ink-2)}
.p-orange{background:var(--orange-bg);color:var(--orange-d)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;transition:background .15s,transform .1s,border-color .15s}
.btn:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;color:var(--navy)}
.btn.sec:hover{background:var(--sky)}
.btn.danger{background:#fff;color:var(--red);border-color:#DDA8A4}
.btn.danger:hover{background:var(--red-bg)}
.btn.accent{background:var(--orange);border-color:var(--orange)}
.btn.accent:hover{background:var(--orange-d);border-color:var(--orange-d)}
.btn.sm{min-height:38px;padding:0 13px;font-size:15px}
.btn.block{width:100%}
.btn[disabled]{background:#C9D3E3;border-color:#C9D3E3;color:#5D6B85;cursor:not-allowed}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border:1.5px solid var(--line-2);background:#fff;border-radius:8px;color:var(--navy)}
.icon-btn:hover{background:var(--sky)}

.field{display:grid;gap:6px;align-content:start}
.field label,.field .lbl{font-weight:700;font-size:15px}
.opt{font-weight:400;color:var(--ink-2);font-size:13px}
.field small{color:var(--ink-2);font-size:13px}
input,select,textarea{width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--line-2);border-radius:8px;background:#fff}
textarea{resize:vertical;min-height:84px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:3px solid #B9CFEF;outline-offset:0}
::placeholder{color:#6B7A96}
.form{display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.form-err{color:var(--red);font-weight:700;min-height:0}
.form-err:empty{display:none}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;width:1px;height:1px;clip:rect(0 0 0 0);min-height:0;padding:0;border:0}
.chip span,.chip button{display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border:1.5px solid var(--line-2);border-radius:8px;background:#fff;font-weight:700;color:var(--navy);cursor:pointer;transition:background .12s,border-color .12s}
.chip span:hover,.chip button:hover{background:var(--sky)}
.chip input:checked + span{background:var(--navy);border-color:var(--navy);color:#fff}
.chip input:focus-visible + span{outline:3px solid var(--blue-2);outline-offset:2px}
.rate{display:flex;gap:8px}
.rate .chip span{width:46px;justify-content:center;padding:0}

/* ----- dates (ISO weeks, Monday start) ----- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
function isoWeekOf(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return{y,w}}
const weekKeyOf=d=>{const {y,w}=isoWeekOf(d);return y+'-W'+pad(w)};
function weekStart(key){const [y,w]=key.split('-W').map(Number);const jan4=new Date(Date.UTC(y,0,4));const day=jan4.getUTCDay()||7;const mon=new Date(jan4);mon.setUTCDate(jan4.getUTCDate()-day+1+(w-1)*7);return new Date(mon.getUTCFullYear(),mon.getUTCMonth(),mon.getUTCDate())}
const weekEnd=k=>addDays(weekStart(k),6);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=d=>d.getDate()+' '+MON[d.getMonth()];
const fmtDY=d=>fmtD(d)+' '+d.getFullYear();
const wkNum=k=>Number(k.split('-W')[1]);
const weekLabel=k=>'Week '+wkNum(k);

const shiftWeek=(k,n)=>weekKeyOf(addDays(weekStart(k),7*n));
const curWeek=()=>weekKeyOf(new Date());
function weeksBetween(a,b){const out=[];let k=weekKeyOf(a);const last=weekKeyOf(b);let g=0;while(g++<520){out.push(k);if(k>=last)break;k=shiftWeek(k,1)}return out}
function resolvePeriod(p){
  let a=p.from,b=p.to;if(a>b){const t=a;a=b;b=t}
  const start=p.mode==='week'?weekStart(a):parseISO(a);
  const end=p.mode==='week'?weekEnd(b):parseISO(b);
  return{start,end,weeks:weeksBetween(start,end)};
}
function periodLabel(p,per){
  if(p.mode==='week'){const a=p.from<=p.to?p.from:p.to,b=p.from<=p.to?p.to:p.from;return (a===b?weekLabel(a):'Weeks '+wkNum(a)+' to '+wkNum(b))+' · '+fmtD(per.start)+' – '+fmtDY(per.end)}

}

/* ----- hashing (demo-grade; a real deployment hashes on the server) ----- */
async function hashPw(pw,salt){
  const str=salt+':'+pw;
  try{
    if(typeof crypto!=='undefined'&&crypto.subtle){
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^h1>>>16,2246822507)^Math.imul(h2^h2>>>13,3266489909);
  h2=Math.imul(h2^h2>>>16,2246822507)^Math.imul(h1^h1>>>13,3266489909);
  return 'f'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

async function buildSeed(){
  const r=rng(20260920),salt='slji';
  const pw=await hashPw('Slji@2026',salt);
  const pick=a=>a[Math.floor(r()*a.length)];
  const wpick=(items,ws)=>{let t=r()*sum(ws);for(let i=0;i<items.length;i++){t-=ws[i];if(t<=0)return items[i]}return items[items.length-1]};

/* ----- metrics ----- */
const inSubject=(subj,r)=>subj.type==='org'||(subj.type==='unit'&&r.unitId===subj.id)||(subj.type==='user'&&r.userId===subj.id);
function pool(db,subj,per){
  const wk=new Set(per.weeks);
  /* Removed (deactivated) staff keep their historical records for their own audit trail (subj.type==='user'),
     but are excluded from org/unit aggregate performance so a removal doesn't leave stale numbers behind. */
  const activeIds=new Set(db.users.filter(u=>u.active).map(u=>u.id));
  const keep=r=>subj.type==='user'||activeIds.has(r.userId);
  return{plans:db.plans.filter(p=>wk.has(p.weekKey)&&inSubject(subj,p)&&keep(p)),asses:db.assessments.filter(a=>wk.has(a.weekKey)&&inSubject(subj,a)&&keep(a))};
}
function computeMetrics(db,subj,per){
  const {plans,asses}=pool(db,subj,per);
  const causes={};CAUSES.forEach(c=>causes[c]=0);
  asses.forEach(a=>{if(causes[a.cause]!==undefined)causes[a.cause]++});
  const series=per.weeks.map(k=>{const l=asses.filter(a=>a.weekKey===k);return{key:k,val:wavg(l),n:l.length}});
  const sw={};asses.forEach(a=>{(sw[a.userId+'|'+a.weekKey]=sw[a.userId+'|'+a.weekKey]||[]).push(a)});
  const scores=Object.keys(sw).map(k=>wavg(sw[k]));
  const dist=BANDS.map(b=>({key:b.key,label:b.label,range:b.range,color:b.color,n:0}));
  scores.forEach(s=>{const b=bandOf(s);dist.find(x=>x.key===b.key).n++});
  return{planned:plans.length,assessed:asses.length,rate:plans.length?Math.min(100,asses.length/plans.length*100):null,
    perf:wavg(asses),rating:mean(asses.map(a=>a.rating)),p1:wavg(asses.filter(a=>a.pri==='P1')),
    onTrack:asses.length?asses.filter(a=>a.ach>=75).length/asses.length*100:null,
    issues:sum(CAUSES.map(c=>causes[c])),causes,series,dist,scored:scores.length,asses};
}
function rankStaff(db,unitId,per){
  const wk=new Set(per.weeks);
  return db.users.filter(u=>u.role==='staff'&&u.active&&(!unitId||u.unitId===unitId)).map(u=>{
    const l=db.assessments.filter(a=>a.userId===u.id&&wk.has(a.weekKey));
    return{user:u,perf:wavg(l),n:l.length};
  }).filter(x=>x.perf!==null).sort((a,b)=>b.perf-a.perf);
}

function canViewUser(v,u){

  if(v.role==='admin')return true;

function scopedDB(db,v){
  const admin=v.role==='admin',head=v.role==='head';

  return{

    users:db.users.filter(u=>canViewUser(v,u)),

    requests:db.requests.filter(r=>admin||(head&&r.unitId===v.unitId)),
    decisions:admin?db.decisions:[]
  };
}

/* Subscribes to the shared cloud document. onFirstData(remoteOrNull) fires once with
   the first snapshot (used to bootstrap DB on load); every later snapshot from another
   device updates DB in place and redraws. hasPendingWrites snapshots are our own writes
   echoing back and are skipped, so this never fights with what the person just typed. */
function watchCloud(onFirstData){
  let first=true;
  cloudDoc.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites){setSync('ok','Synced');return}
    if(!snap.exists){if(first){first=false;onFirstData(null)}setSync('ok','Synced');return}
    const remote=snap.data();
    if(first){first=false;onFirstData(remote);setSync('ok','Synced');return}
    if(JSON.stringify(remote)===JSON.stringify(DB)){setSync('ok','Synced');return}
    DB=remote;lsSet(KEY,JSON.stringify(DB));
    if(ME){const u=DB.users.find(x=>x.id===ME.id&&x.active);if(u)ME=u;else{ME=null;ssSet(SKEY,null);draw(true);return}}
    draw(false);setSync('ok','Synced · updated just now');
  },err=>{console.error('Cloud sync error',err);setSync('err','Cloud sync interrupted — check your connection')});
}
/* Writes the whole DB back to the cloud (debounced so a burst of local edits becomes
   one write). Firestore then pushes it to every other open device via watchCloud above. */
function pushCloud(){
  if(!cloudReady||!cloudDoc)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{
    cloudDoc.set(DB).then(()=>setSync('ok','Synced')).catch(e=>{console.error('Cloud save failed',e);setSync('err','Saved on this device only — will retry when back online')});
  },150);
}

async function tryLogin(username,pw){
  if(Date.now()<lockUntil)return{err:'Too many attempts. Wait '+Math.ceil((lockUntil-Date.now())/1000)+' seconds and try again.'};
  const u=DB.users.find(x=>x.active&&x.username.toLowerCase()===String(username).trim().toLowerCase());
  const h=u?await hashPw(pw,u.salt):'';
  if(u&&h===u.pw){attempts=0;return{user:u}}
  attempts++;
  if(attempts>=5){lockUntil=Date.now()+30000;attempts=0}
  return{err:'Username or password is not correct.'};
}

function toast(msg,type){
  const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),3400);
}
function openModal(title,body){
  const m=$('#modal');m.hidden=false;
  m.innerHTML='<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><header><h2 id="dlg-t">'+esc(title)+'</h2><button class="icon-btn" data-act="close-modal" aria-label="Close">'+icon('x')+'</button></header><div class="dlg-b">'+body+'</div></div>';
  document.body.classList.add('noscroll');
  const f=m.querySelector('input:not([type=hidden]),select,textarea');if(f)setTimeout(()=>f.focus(),60);
}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';document.body.classList.remove('noscroll')}
let confirmCb=null;
function confirmBox(title,text,okLabel,cb,danger){
  confirmCb=cb;
  openModal(title,'<p>'+esc(text)+'</p><div class="actions"><button class="btn sec" data-act="close-modal">Cancel</button><button class="btn '+(danger===false?'':'danger')+'" data-act="confirm-yes">'+esc(okLabel)+'</button></div>');
}
const fld=(label,name,o)=>{o=o||{};return '<div class="field"><label for="f-'+name+'">'+label+(o.req===false?' <span class="opt">optional</span>':'')+'</label><input id="f-'+name+'" name="'+name+'" type="'+(o.type||'text')+'" value="'+esc(o.value)+'" '+(o.req===false?'':'required')+' '+(o.ph?'placeholder="'+esc(o.ph)+'"':'')+' '+(o.attrs||'')+'>'+(o.help?'<small>'+o.help+'</small>':'')+'</div>'};
const area=(label,name,value,o)=>{o=o||{};const id='f-'+name+(o.sfx||'');return '<div class="field"><label for="'+id+'">'+label+(o.req===false?' <span class="opt">optional</span>':'')+'</label><textarea id="'+id+'" name="'+name+'" rows="'+(o.rows||3)+'" maxlength="'+(o.max||500)+'" '+(o.req===false?'':'required')+'>'+esc(value)+'</textarea></div>'};
const selBox=(label,name,opts,value,o)=>{o=o||{};return '<div class="field"><label for="f-'+name+'">'+label+'</label><select id="f-'+name+'" name="'+name+'" '+(o.req===false?'':'required')+'>'+opts.map(x=>'<option value="'+esc(x[0])+'"'+(String(x[0])===String(value)?' selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select></div>'};
const formErr=(f,msg)=>{const e=f.querySelector('.form-err');if(e)e.textContent=msg;else toast(msg,'bad')};
const emptyBox=(t,d,btn)=>'<div class="empty"><b>'+esc(t)+'</b>'+esc(d)+(btn||'')+'</div>';
const pageHead=(t,sub,actions,extra)=>'<div class="page-head"><div><h1>'+esc(t)+'</h1>'+(sub?'<p>'+sub+'</p>':'')+(extra||'')+'</div>'+(actions?'<div class="head-actions">'+actions+'</div>':'')+'</div>';
const privacyNote=t=>'<p class="lock-note">'+icon('lock',16)+esc(t)+'</p>';
const weekbar=(min,max)=>{const wk=UI.week;return '<div class="weekbar"><button class="icon-btn" data-act="wk-prev" aria-label="Previous week">'+icon('left')+'</button><div class="wk"><b>'+weekLabel(wk)+(wk===curWeek()?' · this week':'')+'</b><span>'+weekRange(wk)+'</span></div><button class="icon-btn" data-act="wk-next" aria-label="Next week">'+icon('right')+'</button>'+(wk!==curWeek()?'<button class="btn sec sm" data-act="wk-now">Jump to this week</button>':'')+'</div>'};
const bar=(v,color)=>'<div class="bar" role="img" aria-label="'+fmtPct(v)+'"><span data-w="'+(v==null?0:clamp(v,0,100))+'" style="background:'+(color||(v==null?'#9FB0CB':bandOf(v).color))+'"></span></div>';
function kpi(label,value,sub,cls){return '<div class="card kpi '+(cls||'')+'"><div class="kpi-l">'+label+'</div><div class="kpi-v">'+value+'</div>'+(sub?'<div class="kpi-s">'+sub+'</div>':'')+'</div>'}
function topCause(list){const c={};list.forEach(a=>{if(a.cause&&a.cause!=='None')c[a.cause]=(c[a.cause]||0)+1});const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return k||''}
const planLabel=p=>esc(p.activity);

/* ----- charts (SVG, solid fills only) ----- */
function slot(id,fn){CH[id]=fn;return '<div class="chart-slot" data-cid="'+id+'"></div>'}
function paintCharts(){$$('.chart-slot').forEach(s=>{const fn=CH[s.dataset.cid];if(fn)s.innerHTML=fn(Math.max(240,Math.floor(s.clientWidth||320)))})}
function animateBars(){requestAnimationFrame(()=>requestAnimationFrame(()=>$$('.bar > span[data-w]').forEach(s=>{s.style.width=s.dataset.w+'%'})))}
function lineChart(W,sets,labels,ariaLabel){
  const H=230,m={l:36,r:12,t:12,b:30},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const n=Math.max(1,labels.length);
  const x=i=>m.l+(n<=1?iw/2:i*iw/(n-1)),y=v=>m.t+ih-(v/100)*ih;
  let g='';
  [0,25,50,75,100].forEach(t=>{g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="#DDE5F1"/><text x="'+(m.l-8)+'" y="'+(y(t)+4)+'" text-anchor="end" font-size="12" fill="#4A5A78">'+t+'</text>'});
  const step=Math.max(1,Math.ceil(n/Math.max(2,Math.floor(iw/46))));
  labels.forEach((lb,i)=>{if(i%step===0||i===n-1)g+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="#4A5A78">'+esc(lb)+'</text>'});
  sets.forEach(s=>{
    let d='',pen=false;
    s.vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true});
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="7 5"':'')+'/>';
    s.vals.forEach((v,i)=>{if(v!=null)g+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" fill="#fff" stroke="'+s.color+'" stroke-width="2.2"><title>'+esc(s.name)+' · '+esc(labels[i])+': '+Math.round(v)+'%</title></circle>'});
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(ariaLabel||'Performance trend')+'">'+g+'</svg>';
}
function distChart(W,sets){
  const H=220,m={l:30,r:8,t:24,b:48},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const max=Math.max(1,...sets.flatMap(s=>s.dist.map(b=>b.n)));
  const gw=iw/BANDS.length,k=sets.length,bw=Math.min(52,(gw-14)/k);
  let g='';
  const yy=v=>m.t+ih-(v/max)*ih;
  g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+(m.t+ih)+'" y2="'+(m.t+ih)+'" stroke="#9FB0CB"/>';
  g+='<text x="'+(m.l-8)+'" y="'+(m.t+ih+4)+'" text-anchor="end" font-size="12" fill="#4A5A78">0</text><text x="'+(m.l-8)+'" y="'+(m.t+4)+'" text-anchor="end" font-size="12" fill="#4A5A78">'+max+'</text>';
  BANDS.forEach((b,bi)=>{
    const cx=m.l+gw*bi+gw/2;
    sets.forEach((s,si)=>{
      const n=s.dist[bi].n,h=(n/max)*ih,x0=cx-(k*bw)/2+si*bw;
      const fill=k>1?s.color:b.color;
      g+='<rect class="grow" x="'+(x0+(k>1?2:0))+'" y="'+(m.t+ih-h)+'" width="'+(bw-(k>1?4:0))+'" height="'+Math.max(h,0)+'" fill="'+fill+'" rx="3"><title>'+esc(s.name)+' · '+b.label+': '+n+'</title></rect>';
      g+='<text x="'+(x0+bw/2)+'" y="'+(m.t+ih-h-6)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#14213A">'+n+'</text>';
    });
    g+='<text x="'+cx+'" y="'+(H-24)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#14213A">'+b.label+'</text><text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="#4A5A78">'+b.range+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Performance distribution">'+g+'</svg>';
}

VIEWS.unit=()=>{
  const V=scoped(),wk=UI.week,cw=curWeek(),staff=unitStaff(V);
  const rows=staff.map(u=>{const p=V.plans.filter(x=>x.userId===u.id&&x.weekKey===wk),a=V.assessments.filter(x=>x.userId===u.id&&x.weekKey===wk);return{u,p,a,perf:wavg(a),cause:topCause(a)}});
  const m=computeMetrics(V,{type:'unit',id:ME.unitId},{weeks:[wk]});
  const submitted=rows.filter(r=>r.p.length).length;
  const gaps=[];
  rows.forEach(r=>{
    if(!r.p.length)gaps.push({tone:'p-warn',t:r.u.name+' has not submitted a plan',d:'No plan items for '+weekLabel(wk)+'.'});
    else if(wk<cw&&r.a.length<r.p.length)gaps.push({tone:'p-warn',t:r.u.name+' has unassessed items',d:r.a.length+' of '+r.p.length+' items assessed.'});
    if(r.perf!=null&&r.perf<60)gaps.push({tone:'p-bad',t:r.u.name+' is below 60%',d:'Main cause: '+(r.cause||'not recorded')+'.'});
  });
  const pendingReq=V.requests.filter(q=>q.status==='Pending').length;
  const totalCause=sum(CAUSES.map(c=>m.causes[c]));
  return pageHead(unitName(ME.unitId),'Unit overview for '+weekLabel(wk)+'.','<button class="btn sec" data-act="go" data-r="report">'+icon('doc',18)+'Divisional report</button>')+weekbar()+

  '<div class="g2"><section class="card"><div class="card-h"><h2>Staff</h2></div>'+(rows.length?'<div class="list">'+rows.map(r=>'<div class="row"><span class="avatar" style="background:#E6EEF9">'+esc(ini(r.u.name))+'</span><div class="who"><b>'+esc(r.u.name)+'</b><small>'+r.p.length+' planned · '+r.a.length+' assessed'+(r.cause?' · '+r.cause:'')+'</small></div><div class="end"><button class="btn sec sm" data-act="open-review" data-id="'+r.u.id+'">Review</button></div><div class="meter"><div class="num"><span>'+(r.perf==null?'No score':bandOf(r.perf).label)+'</span><span>'+fmtPct(r.perf)+'</span></div>'+bar(r.perf)+'</div></div>').join('')+'</div>':emptyBox('No staff in this unit','Ask the executive team to add staff to your unit.'))+'</section>'+
  '<div class="stack"><section class="card"><div class="card-h"><h2>Gaps to follow up</h2></div>'+(gaps.length?gaps.map(g=>'<div class="issue"><div class="l"><span class="pill '+g.tone+'">'+(g.tone==='p-bad'?'Low score':'Follow up')+'</span><b>'+esc(g.t)+'</b></div><span class="muted">'+esc(g.d)+'</span></div>').join(''):'<p class="muted">No gaps found for this week.</p>')+'</section>'+
  '<section class="card"><div class="card-h"><h2>Issues by cause</h2></div>'+CAUSES.map(c=>'<div class="divrow"><div class="top2"><span>'+c+'</span><span>'+m.causes[c]+'</span></div>'+bar(totalCause?m.causes[c]/totalCause*100:0,'#1D4E9A')+'</div>').join('')+'</section></div></div></div>';

function reportBody(r){
  const list=v=>{const items=String(v||'').split('\n').map(s=>s.trim()).filter(Boolean);return items.length?'<ul style="margin:6px 0 0 18px;padding:0">'+items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>':''};
  const sec=(t,v)=>v?'<p style="margin-top:8px"><b>'+t+'</b></p>'+list(v):'';
  const newKeys=['achievements','successes','positiveFeedback','goodPractices','missedTargets','delays','qualityProblems','coordinationProblems','resourceConstraints','improvements','nextWeek'];
  const hasNew=newKeys.some(k=>r[k]);
  let out='';
  if(r.summary||r.gaps||r.recommend)out+='<p><b>Summary.</b> '+esc(r.summary||'–')+'</p><p><b>Gaps.</b> '+esc(r.gaps||'–')+'</p><p><b>Recommendations.</b> '+esc(r.recommend||'–')+'</p>';
  if(hasNew){
    out+='<h4 style="margin-top:'+(out?'14px':'0')+'">A. What went well</h4>'+sec('Major achievements',r.achievements)+sec('Important successes',r.successes)+sec('Positive feedback received',r.positiveFeedback)+sec('Good practices identified',r.goodPractices)+
    '<h4 style="margin-top:14px">B. What did not go well</h4>'+sec('Missed targets',r.missedTargets)+sec('Delays',r.delays)+sec('Quality problems',r.qualityProblems)+sec('Coordination problems',r.coordinationProblems)+sec('Resource constraints',r.resourceConstraints)+
    (r.improvements?'<h4 style="margin-top:14px">C. What needs to change</h4>'+list(r.improvements):'')+
    (r.nextWeek?'<h4 style="margin-top:14px">E. Next week\'s commitment</h4>'+list(r.nextWeek):'');
  }
  return out||'<p class="muted">No details recorded.</p>';
}
const accItem=(title,meta,body)=>'<div class="acc"><button class="acc-head" data-act="toggle" aria-expanded="false"><span><b>'+title+'</b><br><small class="muted">'+esc(meta)+'</small></span><span class="chev">'+icon('down')+'</span></button><div class="collapse"><div class="in"><div class="acc-body">'+body+'</div></div></div></div>';

function parseSubject(s){
  if(s&&s.indexOf('u:')===0){const id=s.slice(2);if(DB.units.find(u=>u.id===id))return{type:'unit',id}}
  if(s&&s.indexOf('p:')===0){const id=s.slice(2);if(DB.users.find(u=>u.id===id&&u.role==='staff'))return{type:'user',id}}
  return{type:'org'};
}
function subjectLabel(s){
  if(s.type==='unit')return unitName(s.id);
  if(s.type==='user'){const u=DB.users.find(x=>x.id===s.id);return u.name+' ('+unitName(u.unitId)+')'}
  return 'Whole organisation';
}
const periodOf=s=>s.mode==='week'?{mode:'week',from:s.wFrom,to:s.wTo}:{mode:'date',from:s.dFrom,to:s.dTo};
function initCmd(){
  const cw=curWeek();
  const mk=(f,t)=>({subj:'org',mode:'week',wFrom:f,wTo:t,dFrom:iso(weekStart(f)),dTo:iso(weekEnd(t))});
  UI.cmd={A:mk(shiftWeek(cw,-8),shiftWeek(cw,-1)),B:Object.assign(mk(shiftWeek(cw,-16),shiftWeek(cw,-9)),{on:false}),open:true};
}
function cmdModel(){
  const sides=[['A',UI.cmd.A]];if(UI.cmd.B.on)sides.push(['B',UI.cmd.B]);
  const R=sides.map(([k,s])=>{
    const subj=parseSubject(s.subj),pp=periodOf(s),per=resolvePeriod(pp);
    const m=computeMetrics(DB,subj,per);
    const unitId=subj.type==='unit'?subj.id:null;
    return{k,s,subj,per,m,color:C[k],label:subjectLabel(subj),plabel:periodLabel(pp,per),ranks:rankStaff(DB,unitId,per),unitId};
  });
  const divisions=activeUnits().map(u=>({u,vals:R.map(r=>computeMetrics(DB,{type:'unit',id:u.id},r.per).perf)})).sort((a,b)=>(b.vals[0]||0)-(a.vals[0]||0));
  const wk=new Set(R[0].per.weeks);
  const reports=DB.reports.filter(r=>wk.has(r.weekKey)&&(R[0].subj.type==='org'||(R[0].subj.type==='unit'&&r.unitId===R[0].subj.id)||(R[0].subj.type==='user'&&r.unitId===(DB.users.find(u=>u.id===R[0].subj.id)||{}).unitId))).sort((a,b)=>b.weekKey.localeCompare(a.weekKey));
  return{R,cmp:R.length>1,divisions,reports,decisions:DB.decisions.slice().sort((a,b)=>b.date.localeCompare(a.date))};
}
function weekOptions(sel){
  const cw=curWeek();let o='';
  for(let i=60;i>=0;i--){const k=shiftWeek(cw,-i);o+='<option value="'+k+'"'+(k===sel?' selected':'')+'>'+k.slice(0,4)+' · Week '+wkNum(k)+' · '+fmtD(weekStart(k))+'</option>'}
  return o;
}
function subjectOptions(sel){

  o+='</optgroup>';

    if(st.length){o+='<optgroup label="Individuals · '+esc(u.name)+'">';st.forEach(x=>{o+='<option value="p:'+x.id+'"'+(sel==='p:'+x.id?' selected':'')+'>'+esc(x.name)+'</option>'});o+='</optgroup>'}

const dlt=(a,b,dec,suffix,higher)=>{
  if(a==null||b==null)return '';
  const d=a-b;if(Math.abs(d)<Math.pow(10,-dec)/2)return '<span class="pill p-mute">Same</span>';
  const cls=higher===null?'p-blue':((higher?d>0:d<0)?'p-ok':'p-bad');
  return '<span class="pill '+cls+'">'+(d>0?'+':'−')+Math.abs(d).toFixed(dec)+suffix+'</span>';
};

function unitweekBody(){
  const units=activeUnits(),unitId=UI.uw.unitId,userId=UI.uw.userId,wk=UI.uw.week||curWeek();
  const staffList=unitId?DB.users.filter(u=>u.active&&u.role==='staff'&&u.unitId===unitId):[];
  const unitSel='<div class="field"><label for="uw-u">Unit</label><select id="uw-u" data-change="uw-unit"><option value="">Choose a unit</option>'+units.map(u=>'<option value="'+u.id+'"'+(u.id===unitId?' selected':'')+'>'+esc(u.name)+'</option>').join('')+'</select></div>';
  const staffSel='<div class="field"><label for="uw-s">Employee</label><select id="uw-s" data-change="uw-user"'+(staffList.length?'':' disabled')+'><option value="">'+(unitId?(staffList.length?'Choose an employee':'No staff in this unit'):'Choose a unit first')+'</option>'+staffList.map(u=>'<option value="'+u.id+'"'+(u.id===userId?' selected':'')+'>'+esc(u.name)+'</option>').join('')+'</select></div>';
  const wkNav='<div class="weekbar"><button class="icon-btn" data-act="uw-wk-prev" aria-label="Previous week">'+icon('left')+'</button><div class="wk"><b>'+weekLabel(wk)+(wk===curWeek()?' · this week':'')+'</b><span>'+weekRange(wk)+'</span></div><button class="icon-btn" data-act="uw-wk-next" aria-label="Next week">'+icon('right')+'</button>'+(wk!==curWeek()?'<button class="btn sec sm" data-act="uw-wk-now">Jump to this week</button>':'')+'</div>';
  const picker='<section class="card"><div class="card-h"><h2>Choose what to review</h2><p>Executive Head → Unit → Employee → Week.</p></div><div class="row2">'+unitSel+staffSel+'</div>'+wkNav+'</section>';
  if(!unitId||!userId)return picker+emptyBox('Choose a unit, an employee and a week','Select all three above to view their weekly plan, actual performance and behavioural assessment.');
  const u=DB.users.find(x=>x.id===userId&&x.active);
  if(!u)return picker+emptyBox('This employee is no longer active','Choose another employee.');
  const plans=DB.plans.filter(p=>p.userId===userId&&p.weekKey===wk).sort(byPri);
  const asses=DB.assessments.filter(a=>a.userId===userId&&a.weekKey===wk);
  const behav=(DB.behaviors||[]).find(b=>b.userId===userId&&b.weekKey===wk);
  const basic='<section class="card"><div class="card-h"><h2>A. Basic information</h2></div><dl class="facts"><div><dt>Employee</dt><dd>'+esc(u.name)+'</dd></div><div><dt>Division / Unit</dt><dd>'+esc(unitName(unitId))+'</dd></div><div><dt>Week</dt><dd>'+weekLabel(wk)+' · '+weekRange(wk)+'</dd></div><div><dt>Designation</dt><dd>'+esc(u.title||'—')+'</dd></div></dl></section>';
  const planSec='<section><div class="card-h"><h2>B. Weekly work plan</h2></div>'+(plans.length?'<div class="plans">'+plans.map(p=>planCard(p,asses.find(a=>a.planId===p.id),false)).join('')+'</div>':emptyBox('No plan items for this week',''))+'</section>';
  const assessCard=a=>{
    const p=plans.find(x=>x.id===a.planId);
    return '<article class="card"><div class="plan-top"><span class="pill '+bandCls(a.ach)+'">'+a.ach+'% achieved</span><span class="pill '+(a.status==='Completed'?'p-ok':a.status==='Partial'?'p-warn':'p-bad')+'">'+a.status+'</span><span class="pill '+(a.timeliness==='OnTime'?'p-ok':'p-bad')+'">'+(a.timeliness==='OnTime'?'On time':'Delayed')+'</span></div><h3 style="font-size:17px">'+esc(p?p.activity:'—')+'</h3><dl class="facts"><div><dt>Quality</dt><dd>'+a.rating+' / 5</dd></div><div><dt>Cause of gap</dt><dd>'+esc(a.cause||'None')+'</dd></div></dl>'+(a.note?'<p class="muted" style="margin-top:8px">'+esc(a.note)+'</p>':'')+(a.impact||a.corrective?'<div class="note" style="margin-top:10px"><b>Non-achievement &amp; problem analysis</b> '+(a.impact?'Impact: '+esc(a.impact)+'. ':'')+(a.corrective?'Corrective action: '+esc(a.corrective)+'. ':'')+(a.corrDeadline?'By '+fmtDY(parseISO(a.corrDeadline))+'. ':'')+(a.responsible?'Responsible: '+esc(a.responsible)+'.':'')+'</div>':'')+'</article>';
  };
  const assessSec='<section><div class="card-h"><h2>C. Actual performance assessment</h2></div>'+(asses.length?'<div class="plans">'+asses.map(assessCard).join('')+'</div>':emptyBox('Not yet assessed',''))+'</section>';
  const behavSec='<section class="card"><div class="card-h"><h2>D. Weekly behavioural &amp; competency assessment</h2></div>'+(behav?BEHAVIOR_DIMS.map(d=>'<div class="divrow"><div class="top2"><span>'+d[1]+'</span><span>'+(behav.scores[d[0]]||'–')+' / 5</span></div>'+bar((behav.scores[d[0]]||0)/5*100,'#1D4E9A')+'</div>').join('')+(behav.note?'<p style="margin-top:10px"><b>Comments.</b> '+esc(behav.note)+'</p>':''):emptyBox('Not yet submitted',''))+'</section>';
  return picker+'<div class="stack">'+basic+planSec+assessSec+behavSec+'</div>';
}
VIEWS.command=()=>{
  if(!UI.cmd)initCmd();
  const M=cmdModel(),R=M.R,A=R[0],B=R[1];
  const kdefs=[
    ['Overall performance',m=>m.perf,fmtPct,true,true,'Priority-weighted'],
    ['Assessment coverage',m=>m.rate,fmtPct,true,true,'Plans with an assessment'],
    ['Critical (P1) delivery',m=>m.p1,fmtPct,true,true,'Achievement on P1 items'],
    ['On track',m=>m.onTrack,fmtPct,true,true,'Items at 75% or above'],
    ['Issues logged',m=>m.issues,v=>v==null?'–':String(v),false,false,'Management, resource, coordination']];
  const kcards=kdefs.map(d=>'<div class="card kpi"><div class="kpi-l">'+d[0]+'</div><div class="kpi-v" style="color:'+(M.cmp?C.A:'var(--navy)')+'">'+d[2](d[1](A.m))+'</div>'+(M.cmp?'<div class="kpi-b"><span class="dot" style="background:'+C.B+';margin:0"></span><b style="color:'+C.B+'">'+d[2](d[1](B.m))+'</b>'+dlt(d[1](A.m),d[1](B.m),d[3]?1:0,d[3]?' pts':'',d[4])+'</div>':'<div class="kpi-s">'+d[5]+'</div>')+'</div>').join('');
  const cmpRows=[
    ['Plan items',m=>m.planned,String,0,'',null],['Assessments recorded',m=>m.assessed,String,0,'',null],
    ['Overall performance',m=>m.perf,fmtPct,1,' pts',true],['Assessment coverage',m=>m.rate,fmtPct,1,' pts',true],['Critical (P1) delivery',m=>m.p1,fmtPct,1,' pts',true],['On track (75% or above)',m=>m.onTrack,fmtPct,1,' pts',true],
    ['Average quality rating',m=>m.rating,v=>v==null?'–':v.toFixed(1)+' / 5',1,'',true]
    ].concat(CAUSES.map(c=>[c+' issues',m=>m.causes[c],String,0,'',false]));
  const cmpTable=M.cmp?'<section class="card"><div class="card-h"><h2>Side-by-side comparison</h2><p>Subject A compared with Subject B. Green means A is better, red means B is better.</p></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Measure</th><th class="n"><span class="dot" style="background:'+C.A+'"></span>A</th><th class="n"><span class="dot" style="background:'+C.B+'"></span>B</th><th class="n">Difference</th></tr></thead><tbody>'+
    cmpRows.map(d=>'<tr><td>'+d[0]+'</td><td class="n"><b>'+d[2](d[1](A.m))+'</b></td><td class="n"><b>'+d[2](d[1](B.m))+'</b></td><td class="n">'+dlt(d[1](A.m),d[1](B.m),d[3],d[4],d[5])+'</td></tr>').join('')+'</tbody></table></div></section>':'';
  const legend=M.cmp?'<div class="legend"><span><span class="dot" style="background:'+C.A+'"></span>A · '+esc(A.label)+'</span><span><span class="dot" style="background:'+C.B+'"></span>B · '+esc(B.label)+'</span></div>':'';
  const trendLabels=M.cmp?Array.from({length:Math.max(...R.map(r=>r.m.series.length))},(_,i)=>String(i+1)):A.m.series.map(x=>'W'+wkNum(x.key));
  const trend='<section class="card"><div class="card-h"><h2>Weekly performance trend</h2><p>'+(M.cmp?'Points line up by week position within each period (1 is the first week).':'Priority-weighted average for each week in the period.')+'</p></div>'+
    slot('cmd-trend',W=>lineChart(W,R.map((r,i)=>({name:'Subject '+r.k,color:r.color,dash:i===1,vals:r.m.series.map(x=>x.val)})),trendLabels,'Weekly performance trend'))+legend+'</section>';
  const dist='<section class="card"><div class="card-h"><h2>Performance distribution</h2><p>Staff-weeks scored in each band.</p></div>'+slot('cmd-dist',W=>distChart(W,R.map(r=>({name:'Subject '+r.k,color:r.color,dist:r.m.dist}))))+legend+'</section>';
  const divs='<section class="card"><div class="card-h"><h2>Division progress</h2><p>Average performance of each unit in the selected period.</p></div>'+M.divisions.map(d=>{
    const hl=R.some(r=>(r.subj.type==='unit'&&r.subj.id===d.u.id)||(r.subj.type==='user'&&(DB.users.find(x=>x.id===r.subj.id)||{}).unitId===d.u.id));
    return '<div class="divrow"><div class="top2"><span>'+esc(d.u.name)+(hl?' <span class="pill p-blue">Selected</span>':'')+'</span><span>'+d.vals.map((v,i)=>M.cmp?'<span style="color:'+C[R[i].k]+'">'+fmtPct(v)+'</span>':fmtPct(v)).join(' · ')+'</span></div>'+d.vals.map((v,i)=>bar(v,M.cmp?C[R[i].k]:null).replace('class="bar"','class="bar'+(i>0?' thin':'')+'"')).join('')+'</div>';
  }).join('')+'</section>';
  const tot=sum(CAUSES.map(c=>A.m.causes[c])),topC=CAUSES.slice().sort((a,b)=>A.m.causes[b]-A.m.causes[a])[0];
  const byUnit=activeUnits().map(u=>{const l=A.m.asses.filter(a=>a.unitId===u.id);return{u,c:CAUSES.map(c=>l.filter(a=>a.cause===c).length)}}).filter(x=>sum(x.c)>0);
  const issues=A.m.asses.filter(a=>a.cause!=='None').sort((a,b)=>b.weekKey.localeCompare(a.weekKey)||a.ach-b.ach).slice(0,5);
  const bott='<section class="card"><div class="card-h"><h2>Bottlenecks</h2><p>'+(tot?'Most issues come from <b>'+topC+'</b> ('+Math.round(A.m.causes[topC]/tot*100)+'% of those logged for Subject A).':'No issues were logged for Subject A in this period.')+'</p></div>'+
    CAUSES.map(c=>'<div class="divrow"><div class="top2"><span>'+c+'</span><span>'+R.map((r,i)=>M.cmp?'<span style="color:'+r.color+'">'+r.m.causes[c]+'</span>':r.m.causes[c]).join(' · ')+'</span></div>'+R.map((r,i)=>{const t=sum(CAUSES.map(x=>r.m.causes[x]));return bar(t?r.m.causes[c]/t*100:0,M.cmp?r.color:'#D9651B').replace('class="bar"','class="bar'+(i>0?' thin':'')+'"')}).join('')+'</div>').join('')+
    (byUnit.length?'<h3 style="font-size:16px;margin:18px 0 10px">By unit (Subject A)</h3><div class="tbl-wrap"><table class="tbl" style="min-width:420px"><thead><tr><th>Unit</th>'+CAUSES.map(c=>'<th class="n">'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+byUnit.map(x=>'<tr><td>'+esc(x.u.name)+'</td>'+x.c.map(n=>'<td class="n">'+n+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'')+
    (issues.length?'<h3 style="font-size:16px;margin:18px 0 10px">Recent issue notes</h3>'+issues.map(a=>'<div class="issue"><div class="l"><span class="pill p-orange">'+a.cause+'</span><b>'+esc(userName(a.userId))+'</b><span class="muted">'+esc(unitName(a.unitId))+' · '+weekLabel(a.weekKey)+'</span></div><span>'+esc(a.note||'No note')+'</span></div>').join(''):'')+'</section>';
  const rankList=(list,all,low)=>list.length?list.map(x=>'<div class="rank'+(low?' low':'')+'"><span class="pos">'+(all.indexOf(x)+1)+'</span><div><b>'+esc(x.user.name)+'</b><small>'+esc(unitName(x.user.unitId))+' · '+x.n+' items</small></div><span class="pct">'+Math.round(x.perf)+'%</span></div>').join(''):'<p class="muted">No scored staff in this period.</p>';
  const rankBlock=r=>{const top=r.ranks.slice(0,5),low=r.ranks.slice(-5).filter(x=>!top.includes(x)).reverse();
    return '<section class="card"><div class="card-h"><h2>Rankings'+(M.cmp?' · <span style="color:'+r.color+'">Subject '+r.k+'</span>':'')+'</h2><p>'+(r.unitId?esc(unitName(r.unitId))+' staff':'All staff')+' · '+esc(r.plabel)+'</p></div><div class="g2"><div><h3 style="font-size:16px;margin-bottom:6px">Top performers</h3>'+rankList(top,r.ranks,false)+'</div><div><h3 style="font-size:16px;margin-bottom:6px">Needs support</h3>'+rankList(low,r.ranks,true)+'</div></div></section>'};
  const decisions='<section class="card"><div class="card-h"><h2>Key decisions log</h2><button class="btn sm" data-act="dec-add">'+icon('plus',16)+'Log decision</button></div>'+(M.decisions.length?M.decisions.map(d=>'<div class="decision"><div><h3>'+esc(d.title)+'</h3>'+(d.detail?'<p class="muted">'+esc(d.detail)+'</p>':'')+'<div class="meta"><span>'+fmtDY(parseISO(d.date))+'</span>'+(d.unitId?'<span class="pill p-blue">'+esc(unitName(d.unitId))+'</span>':'')+(d.responsible?'<span>'+esc(d.responsible)+'</span>':'')+(d.followup?'<span>Follow-up '+fmtDY(parseISO(d.followup))+'</span>':'')+'<span class="pill '+(d.status==='Done'?'p-ok':'p-warn')+'">'+d.status+'</span></div></div><div class="head-actions" style="align-content:start"><button class="btn sec sm" data-act="dec-toggle" data-id="'+d.id+'">'+(d.status==='Done'?'Reopen':'Mark done')+'</button><button class="icon-btn" style="width:38px;height:38px" data-act="dec-del" data-id="'+d.id+'" aria-label="Delete decision">'+icon('trash',16)+'</button></div></div>').join(''):emptyBox('No decisions logged','Record decisions so the team can follow them up.'))+'</section>';
  const reps='<section class="card"><div class="card-h"><h2>Divisional reports from team heads</h2><p>Reports for the weeks in Subject A\'s period.</p></div>'+(M.reports.length?M.reports.slice(0,8).map(r=>accItem(esc(unitName(r.unitId))+' · '+weekLabel(r.weekKey),'By '+userName(r.headId)+' · Rating '+r.rating+' / 5 · Score '+fmtPct(r.avg),reportBody(r))).join(''):'<p class="muted">No reports were submitted for this period.</p>')+'</section>';
  let body='';
  switch(UI.execTab){
    case 'compare':
      body='<div class="stack"><section class="card filters open"><div class="fgrid">'+sidePanel(A)+(B?sidePanel(B):'<div class="fadd"><b style="color:var(--navy)">Compare with something else</b><span>Add a second employee, unit or period to see them side by side.</span><button class="btn sec" data-act="cmd-add-b">'+icon('plus',18)+'Add comparison</button></div>')+'</div><p class="muted" style="font-size:14px;margin-top:12px">Weeks that overlap a custom date range are included in full.</p></section>'+
      (M.cmp?cmpTable+legend:emptyBox('Add a second subject above to compare','Two employees, units or periods will be shown side by side once you add one.'))+'</div>';
      break;
    case 'divisional':
      body=divisionalBody(UI.week);
      break;
    case 'unitweek':
      body=unitweekBody();
      break;
    case 'actions':
      body=actionsBody();
      break;
    case 'decisions':
      body='<div class="stack">'+decisions+'</div>';
      break;
    case 'nextweek':
      body=nextweekBody();
      break;
    case 'reports':
      body='<div class="stack">'+reps+R.map(rankBlock).join('')+'</div>';
      break;
    default:
      body='<div class="stack"><p class="muted" style="margin:-6px 0 4px">Showing <b>'+esc(A.label)+'</b> · '+esc(A.plabel)+' <button class="btn sec sm" data-act="exec-tab" data-t="compare" style="margin-left:6px">Change</button></p><div class="g5">'+kcards+'</div><div class="g2">'+trend+dist+'</div><div class="g2">'+divs+bott+'</div></div>';
  }
  return pageHead('Executive command center','Decision-making view for the Ameer, CEO and General Secretary.','<button class="btn accent" data-act="export-pdf">'+icon('download',18)+'Export PDF</button>')+
  execTabBar()+'<div class="enter">'+body+'</div>';
};

VIEWS.divisions=()=>{
  const wk=UI.week;
  const cards=activeUnits().map(u=>{
    const m=computeMetrics(DB,{type:'unit',id:u.id},{weeks:[wk]});
    const rep=DB.reports.find(r=>r.unitId===u.id&&r.weekKey===wk);
    const headsList=DB.users.filter(x=>x.active&&x.role==='head'&&x.unitId===u.id);
    const heads=headsList.map(x=>x.name).join(', ')||'No team head assigned';
    const staff=DB.users.filter(x=>x.active&&x.role==='staff'&&x.unitId===u.id);
    const sub=staff.filter(s=>DB.plans.some(p=>p.userId===s.id&&p.weekKey===wk)).length;
    const hr=(DB.headReviews||[]).find(x=>x.unitId===u.id&&x.headId===(headsList[0]&&headsList[0].id)&&x.weekKey===wk);
    const reviewBtn=headsList.length?'<button class="btn sec sm" data-act="head-review" data-unit="'+u.id+'" data-head="'+headsList[0].id+'">'+(hr?'Update head review':'Review head')+'</button>':'';
    return '<article class="card"><div class="card-h" style="margin-bottom:8px"><h2>'+esc(u.name)+'</h2>'+(rep?'<span class="pill p-ok">Report submitted</span>':'<span class="pill p-warn">No report</span>')+'</div><p class="muted" style="margin-bottom:12px">'+esc(heads)+(hr&&hr.weighted!=null?' · Head score '+hr.weighted+'%':'')+'</p><div class="top2 divrow" style="border:0;padding:0"><span>Performance</span><span>'+fmtPct(m.perf)+'</span></div>'+bar(m.perf)+'<p class="muted" style="margin-top:10px;font-size:14px">'+sub+' of '+staff.length+' staff submitted plans · '+m.assessed+' items assessed · '+m.issues+' issues</p>'+(rep?'<div style="margin-top:12px">'+accItem('Read the report','Rating '+rep.rating+' / 5',reportBody(rep))+'</div>':'')+(hr?'<div style="margin-top:8px">'+accItem('Head review · '+hr.weighted+'% weighted score','As of '+fmtD(parseISO(hr.at)),headReviewBody(hr))+'</div>':'')+'<div class="card-actions">'+reviewBtn+'</div></article>';
  }).join('');
  const st={Pending:'p-warn',Approved:'p-ok',Declined:'p-bad'};
  const reqs=DB.requests.slice().sort((a,b)=>(a.status==='Pending'?0:1)-(b.status==='Pending'?0:1)||b.at.localeCompare(a.at));
  return pageHead('Divisions','Reports and resource requests from every unit.')+weekbar()+
  '<div class="stack"><div class="g3">'+cards+'</div><section class="card"><div class="card-h"><h2>Resource requests</h2></div>'+(reqs.length?reqs.slice(0,12).map(q=>'<div class="decision"><div><h3>'+esc(q.item)+'</h3><p class="muted">'+esc(q.detail)+'</p><div class="meta"><span class="pill p-blue">'+esc(unitName(q.unitId))+'</span><span>'+fmtDY(parseISO(q.at))+'</span><span class="pill '+st[q.status]+'">'+q.status+'</span></div>'+(q.decisionNote?'<div class="note"><b>Response</b>'+esc(q.decisionNote)+'</div>':'')+'</div>'+(q.status==='Pending'?'<div class="head-actions" style="align-content:start"><button class="btn sm" data-act="res-approve" data-id="'+q.id+'">Approve</button><button class="btn danger sm" data-act="res-decline" data-id="'+q.id+'">Decline</button></div>':'')+'</div>').join(''):emptyBox('No requests','Team heads can send resource requests from their Resources page.'))+'</section></div>';
};

  HEAD_AREAS.map(a=>'<div class="divrow"><div class="top2"><span>'+a[1]+' ('+a[2]+'%)</span><span>'+hr.areas[a[0]]+' / 5</span></div>'+bar(pct(hr.areas[a[0]]),'#1D4E9A')+'</div>').join('')+
  '<p class="muted" style="margin:14px 0 8px"><b>Weekly review</b></p><div class="tbl-wrap"><table class="tbl"><tbody>'+
  HEAD_REVIEW_Q.map(q=>'<tr><td>'+esc(q[1])+'</td><td class="n"><span class="pill '+(hr.review[q[0]]==='Yes'?'p-ok':hr.review[q[0]]==='Partly'?'p-warn':'p-bad')+'">'+hr.review[q[0]]+'</span></td></tr>').join('')+
  '</tbody></table></div>'+(hr.remarks?'<p style="margin-top:10px"><b>Remarks.</b> '+esc(hr.remarks)+'</p>':'');

const P=s=>String(s==null?'':s).replace(/[–—−]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/≥/g,'>=').replace(/[^\x20-\x7E\u00A0-\u00FF]/g,'');
const hexRgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
async function exportPDF(){
  if(ME.role!=='admin'){toast('Only executives can export reports.','bad');return}
  const lib=window.jspdf&&window.jspdf.jsPDF;
  if(!lib){toast('The PDF tool did not load. Check the connection and try again.','bad');return}
  const M=cmdModel(),R=M.R,A=R[0],B=R[1];
  const doc=new lib({unit:'pt',format:'a4'});
  const PW=595,PH=842,ML=40,CWID=PW-2*ML;
  let y=0;
  doc.setFillColor(15,47,94);doc.rect(0,0,PW,80,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(19);doc.text("Sri Lanka Jama'athe Islami",ML,36);
  doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text('Performance Report - Executive Command Center',ML,56);
  doc.setFontSize(9);doc.text('Generated '+P(fmtDY(new Date()))+' by '+P(ME.name),PW-ML,36,{align:'right'});doc.text('Confidential - executive use only',PW-ML,56,{align:'right'});
  y=106;doc.setTextColor(20,33,58);
  const ensure=h=>{if(y+h>PH-60){doc.addPage();y=56}};
  const h2=t=>{ensure(40);doc.setFont('helvetica','bold');doc.setFontSize(12.5);doc.setTextColor(15,47,94);doc.text(P(t),ML,y);y+=6;doc.setDrawColor(211,220,234);doc.line(ML,y,PW-ML,y);y+=16;doc.setTextColor(20,33,58)};
  const table=(head,body,cols)=>{doc.autoTable({startY:y,head:[head],body,theme:'grid',margin:{left:ML,right:ML},styles:{font:'helvetica',fontSize:8.5,cellPadding:4,textColor:[20,33,58],lineColor:[211,220,234],lineWidth:.5},headStyles:{fillColor:[15,47,94],textColor:255},alternateRowStyles:{fillColor:[243,246,251]},columnStyles:cols||{}});y=doc.lastAutoTable.finalY+20};
  // scope
  h2('Report scope');
  R.forEach(r=>{doc.setFillColor.apply(doc,hexRgb(r.color));doc.rect(ML,y-8,8,8,'F');doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text(P((R.length>1?'Subject '+r.k+': ':'Subject: ')+r.label),ML+14,y);y+=13;doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.text(P('Period: '+r.plabel),ML+14,y);y+=20});
  // summary
  h2('Key measures');
  const rows=[['Plan items',m=>m.planned,String],['Assessments recorded',m=>m.assessed,String],['Overall performance',m=>m.perf,fmtPct],['Assessment coverage',m=>m.rate,fmtPct],['Critical (P1) delivery',m=>m.p1,fmtPct],['On track (75% or above)',m=>m.onTrack,fmtPct],['Average quality rating',m=>m.rating,v=>v==null?'-':v.toFixed(1)+' / 5']].concat(CAUSES.map(c=>[c+' issues',m=>m.causes[c],String]));
  table(['Measure'].concat(R.map(r=>'Subject '+r.k)).concat(B?['Difference (A - B)']:[]),rows.map(d=>{
    const a=d[1](A.m),b=B?d[1](B.m):null;
    const diff=B&&a!=null&&b!=null?((a-b>0?'+':'')+(Math.round((a-b)*10)/10)+(d[2]===fmtPct?' pts':'')):'-';
    return [P(d[0])].concat(R.map(r=>P(d[2](d[1](r.m))))).concat(B?[P(diff)]:[]);
  }),{0:{cellWidth:180}});
  // weekly table
  h2('Weekly performance');
  const nmax=Math.max(...R.map(r=>r.m.series.length));
  const wrows=[];for(let i=0;i<Math.min(nmax,40);i++)wrows.push([P(R.map(r=>r.m.series[i]?('W'+wkNum(r.m.series[i].key)):'-').join(' / '))].concat(R.map(r=>r.m.series[i]&&r.m.series[i].val!=null?Math.round(r.m.series[i].val)+'%':'-')));
  table([R.length>1?'Week (A / B)':'Week'].concat(R.map(r=>'Subject '+r.k)),wrows);
  // distribution (drawn bars)
  h2('Performance distribution (staff-weeks per band)');
  const dmax=Math.max(1,...R.flatMap(r=>r.m.dist.map(b=>b.n)));
  BANDS.forEach((b,bi)=>{
    ensure(R.length*14+10);
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(20,33,58);doc.text(P(b.label+' ('+b.range+')'),ML,y+8);
    R.forEach((r,i)=>{const n=r.m.dist[bi].n,w=(n/dmax)*260;doc.setFillColor(225,232,243);doc.rect(ML+130,y+i*13,260,10,'F');doc.setFillColor.apply(doc,hexRgb(R.length>1?r.color:b.color));if(w>0)doc.rect(ML+130,y+i*13,w,10,'F');doc.setFont('helvetica','normal');doc.text(String(n),ML+398,y+i*13+8)});
    y+=R.length*13+8;
  });
  y+=10;
  // divisions (drawn bars)
  h2('Division progress');
  M.divisions.forEach(d=>{
    ensure(R.length*13+16);
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(20,33,58);doc.text(P(d.u.name),ML,y+8);
    d.vals.forEach((v,i)=>{doc.setFillColor(225,232,243);doc.rect(ML+170,y+i*13,240,10,'F');const c=R.length>1?hexRgb(R[i].color):hexRgb(v==null?'#9FB0CB':bandOf(v).color);doc.setFillColor(c[0],c[1],c[2]);if(v!=null)doc.rect(ML+170,y+i*13,240*clamp(v,0,100)/100,10,'F');doc.setFont('helvetica','normal');doc.text(fmtPct(v),ML+418,y+i*13+8)});
    y+=R.length*13+10;
  });
  y+=8;
  // bottlenecks
  h2('Bottlenecks');
  table(['Cause'].concat(R.map(r=>'Subject '+r.k+' (count)')),CAUSES.map(c=>[c].concat(R.map(r=>{const t=sum(CAUSES.map(x=>r.m.causes[x]));return r.m.causes[c]+(t?' ('+Math.round(r.m.causes[c]/t*100)+'%)':'')}))));
  // rankings
  R.forEach(r=>{
    const top=r.ranks.slice(0,5),low=r.ranks.slice(-5).filter(x=>!top.includes(x)).reverse();
    h2('Top performers'+(R.length>1?' - Subject '+r.k:''));
    table(['#','Name','Unit','Score','Items'],top.map((x,i)=>[String(i+1),P(x.user.name),P(unitName(x.user.unitId)),Math.round(x.perf)+'%',String(x.n)]));
    h2('Needs support'+(R.length>1?' - Subject '+r.k:''));
    table(['Name','Unit','Score','Items'],low.map(x=>[P(x.user.name),P(unitName(x.user.unitId)),Math.round(x.perf)+'%',String(x.n)]));
  });
  // decisions
  h2('Key decisions log');
  table(['Date','Decision','Unit','Status'],M.decisions.slice(0,15).map(d=>[P(fmtDY(parseISO(d.date))),P(d.title),P(d.unitId?unitName(d.unitId):'Organisation'),d.status]),{1:{cellWidth:240}});
  // footer
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(74,90,120);doc.text('SLJI Performance Monitoring System',ML,PH-24);doc.text('Page '+i+' of '+n,PW-ML,PH-24,{align:'right'})}
  const name='SLJI-Performance-Report-'+P(A.label).replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+iso(new Date())+'.pdf';
  const blob=doc.output('blob');
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:blob});toast('PDF report ready','ok');return}
  }catch(e){if(e&&e.code==='declined')return;toast('The PDF could not be saved here. Try again or open the app in a full browser tab.','bad');return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('PDF report ready','ok')}catch(e){toast('The PDF could not be downloaded in this view.','bad')}
}

function resolveReq(id,status){
  if(!needRole('admin'))return;
  const q=DB.requests.find(x=>x.id===id);if(!q)return;
  openModal((status==='Approved'?'Approve':'Decline')+' request','<form class="form" data-form="res-decide" data-id="'+id+'" data-status="'+status+'"><p><b>'+esc(q.item)+'</b><br><span class="muted">'+esc(unitName(q.unitId))+'</span></p>'+area('Note to the team head','note','',{rows:2,req:false,max:300})+'<p class="form-err" role="alert"></p><div class="actions"><button type="button" class="btn sec" data-act="close-modal">Cancel</button><button class="btn '+(status==='Declined'?'danger':'')+'" type="submit">'+(status==='Approved'?'Approve request':'Decline request')+'</button></div></form>');
}

const F={ /* form submit handlers (async allowed) */
  login:async f=>{
    const err=$('#lg-err'),btn=f.querySelector('button[type=submit]');err.textContent='';btn.disabled=true;
    const r=await tryLogin(f.elements.username.value,f.elements.password.value);btn.disabled=false;
    if(r.err){err.textContent=r.err;return}
    signIn(r.user);
  },
  plan:f=>{
    if(!ME||ME.role!=='staff')return;
    const d=new FormData(f),id=f.dataset.id;
    const rec={activity:d.get('activity').trim(),objective:d.get('objective').trim(),priority:d.get('priority'),target:d.get('target').trim(),deadline:d.get('deadline'),resources:d.get('resources').trim(),kpi:d.get('kpi').trim()};
    if(!rec.activity||!rec.objective||!rec.target||!rec.kpi||!rec.deadline)return formErr(f,'Fill in every required field.');
    if(!PRI[rec.priority])return formErr(f,'Choose a priority.');
    if(rec.deadline<iso(weekStart(UI.week)))return formErr(f,'The deadline cannot be before the start of the week.');
    if(id){const p=DB.plans.find(x=>x.id===id);if(!p||p.userId!==ME.id||DB.assessments.some(a=>a.planId===id))return formErr(f,'This item can no longer be edited.');Object.assign(p,rec)}
    else{if(UI.week<curWeek())return formErr(f,'Past weeks cannot be planned.');DB.plans.push(Object.assign({id:uid('p'),userId:ME.id,unitId:ME.unitId,weekKey:UI.week,createdAt:iso(new Date())},rec))}
    persist();closeModal();toast('Plan item saved','ok');draw(false);
  },
  assess:f=>{
    if(!ME||ME.role!=='staff')return;
    const p=DB.plans.find(x=>x.id===f.dataset.plan);if(!p||p.userId!==ME.id)return;
    const d=new FormData(f),ach=Number(d.get('ach')),rating=Number(d.get('rating')),cause=d.get('cause')||'None';
    if(!Number.isFinite(ach)||ach<0||ach>100||d.get('ach')==='')return formErr(f,'Enter a percentage from 0 to 100.');
    if(!(rating>=1&&rating<=5))return formErr(f,'Choose a quality rating from 1 to 5.');
    if(ach<80&&cause==='None')return formErr(f,'Choose the main cause of the gap.');
    const rec={ach:Math.round(ach),rating,cause:ach>=100?'None':cause,note:String(d.get('note')||'').trim(),
      timeliness:d.get('timeliness')==='Delayed'?'Delayed':'OnTime',
      status:['Completed','Partial','NotDone'].includes(d.get('status'))?d.get('status'):'Completed',
      impact:String(d.get('impact')||'').trim(),corrective:String(d.get('corrective')||'').trim(),
      corrDeadline:d.get('corrDeadline')||'',responsible:String(d.get('responsible')||'').trim(),at:iso(new Date())};
    const a=DB.assessments.find(x=>x.planId===p.id);
    if(a)Object.assign(a,rec);else DB.assessments.push(Object.assign({id:uid('a'),planId:p.id,userId:ME.id,unitId:p.unitId,weekKey:p.weekKey,pri:p.priority,headNote:''},rec));
    persist();toast('Assessment saved','ok');draw(false);
  },
  behavior:f=>{
    if(!ME||ME.role!=='staff')return;
    const wk=f.dataset.week,d=new FormData(f),scores={};
    for(const dim of BEHAVIOR_DIMS){const v=Number(d.get('dim_'+dim[0]));if(!(v>=1&&v<=5))return formErr(f,'Rate every dimension from 1 to 5.');scores[dim[0]]=v}
    const rec={scores,note:String(d.get('note')||'').trim(),at:iso(new Date())};
    DB.behaviors=DB.behaviors||[];
    const b=DB.behaviors.find(x=>x.userId===ME.id&&x.weekKey===wk);
    if(b)Object.assign(b,rec);else DB.behaviors.push(Object.assign({id:uid('bv'),userId:ME.id,unitId:ME.unitId,weekKey:wk},rec));
    persist();toast('Behavioural assessment saved','ok');draw(false);
  },
  headnote:f=>{
    if(!ME||ME.role!=='head')return;
    const a=DB.assessments.find(x=>x.id===f.dataset.id);if(!a||a.unitId!==ME.unitId)return;
    a.headNote=String(new FormData(f).get('headNote')||'').trim();persist();toast('Feedback saved','ok');
  },
  request:f=>{
    if(!ME||ME.role!=='head')return;
    const d=new FormData(f),item=d.get('item').trim(),detail=d.get('detail').trim();
    if(!item||!detail)return formErr(f,'Fill in both fields.');
    DB.requests.push({id:uid('q'),unitId:ME.unitId,requestedBy:ME.id,weekKey:curWeek(),item,detail,status:'Pending',decisionNote:'',at:iso(new Date())});
    persist();closeModal();toast('Request sent to management','ok');draw(false);
  },
  report:f=>{
    if(!ME||ME.role!=='head')return;
    const d=new FormData(f),wk=UI.week,get=k=>String(d.get(k)||'').trim();
    const V=scoped(),m=computeMetrics(V,{type:'unit',id:ME.unitId},{weeks:[wk]});
    const rec={
      achievements:get('achievements'),successes:get('successes'),positiveFeedback:get('positiveFeedback'),goodPractices:get('goodPractices'),
      missedTargets:get('missedTargets'),delays:get('delays'),qualityProblems:get('qualityProblems'),coordinationProblems:get('coordinationProblems'),resourceConstraints:get('resourceConstraints'),
      improvements:get('improvements'),nextWeek:get('nextWeek'),
      rating:Number(d.get('rating')),avg:m.perf==null?0:m.perf,at:iso(new Date()),headId:ME.id};
    if(!rec.achievements&&!rec.successes&&!rec.missedTargets&&!rec.delays)return formErr(f,'Record at least what went well and what did not go well this week.');
    const cur=DB.reports.find(r=>r.unitId===ME.unitId&&r.weekKey===wk);
    if(cur)Object.assign(cur,rec);else DB.reports.push(Object.assign({id:uid('r'),unitId:ME.unitId,weekKey:wk},rec));
    persist();toast('Report sent to management','ok');draw(false);
  },
  headreview:f=>{
    if(!needRole('admin'))return;
    const d=new FormData(f),unitId=f.dataset.unit,headId=f.dataset.head,wk=UI.week;
    if(!DB.units.find(u=>u.id===unitId&&u.active)||!DB.users.find(u=>u.id===headId&&u.active&&u.role==='head'))return;
    const areas={};let wsum=0,wtot=0;
    for(const ar of HEAD_AREAS){
      const v=Number(d.get('area_'+ar[0]));
      if(!(v>=1&&v<=5))return formErr(f,'Score every performance area from 1 to 5.');
      areas[ar[0]]=v;wsum+=v*ar[2];wtot+=5*ar[2];
    }
    const review={};
    for(const q of HEAD_REVIEW_Q){
      const v=d.get('q_'+q[0]);
      review[q[0]]=['Yes','Partly','No'].includes(v)?v:'No';
    }
    const rec={unitId,headId,weekKey:wk,areas,weighted:wtot?Math.round(wsum/wtot*100):null,review,remarks:String(d.get('remarks')||'').trim(),at:iso(new Date()),by:ME.id};
    DB.headReviews=DB.headReviews||[];
    const cur=DB.headReviews.find(x=>x.unitId===unitId&&x.headId===headId&&x.weekKey===wk);
    if(cur)Object.assign(cur,rec);else DB.headReviews.push(Object.assign({id:uid('hr')},rec));
    persist();closeModal();toast('Head review saved','ok');draw(false);
  },
  decision:f=>{
    if(!needRole('admin'))return;
    const d=new FormData(f),title=d.get('title').trim();if(!title)return formErr(f,'Enter the decision.');
    DB.decisions.push({id:uid('d'),date:iso(new Date()),title,detail:String(d.get('detail')||'').trim(),unitId:d.get('unitId')||'',responsible:String(d.get('responsible')||'').trim(),followup:d.get('followup')||'',status:d.get('status')==='Done'?'Done':'Open',by:ME.id});
    persist();closeModal();toast('Decision logged','ok');draw(false);
  },
  'res-decide':f=>{
    if(!needRole('admin'))return;
    const q=DB.requests.find(x=>x.id===f.dataset.id);if(!q)return;
    q.status=f.dataset.status==='Approved'?'Approved':'Declined';q.decisionNote=String(new FormData(f).get('note')||'').trim();
    persist();closeModal();toast('Request '+q.status.toLowerCase(),'ok');draw(false);
  },
  'unit-add':f=>{
    if(!needRole('admin'))return;
    const name=new FormData(f).get('name').trim();
    if(!name)return formErr(f.parentElement,'Enter a unit name.');
    if(activeUnits().some(u=>u.name.toLowerCase()===name.toLowerCase()))return formErr(f.parentElement,'A unit with that name already exists.');
    DB.units.push({id:uid('u'),name,active:true});persist();toast('Unit added','ok');draw(false);
  },
  'unit-rename':f=>{
    if(!needRole('admin'))return;
    const u=DB.units.find(x=>x.id===f.dataset.id),name=new FormData(f).get('name').trim();
    if(!name)return formErr(f,'Enter a unit name.');
    if(activeUnits().some(x=>x.id!==u.id&&x.name.toLowerCase()===name.toLowerCase()))return formErr(f,'A unit with that name already exists.');
    u.name=name;persist();closeModal();toast('Unit renamed','ok');draw(false);
  },
  person:async f=>{
    if(!needRole('admin'))return;
    const d=new FormData(f),id=f.dataset.id;
    const rec={name:d.get('name').trim(),username:d.get('username').trim().toLowerCase(),title:String(d.get('title')||'').trim(),role:d.get('role'),unitId:d.get('unitId')||null};
    if(!rec.name)return formErr(f,'Enter the full name.');
    if(!/^[a-z0-9._-]{3,30}$/.test(rec.username))return formErr(f,'Username must be 3 to 30 letters, numbers, dots or dashes.');
    if(DB.users.some(u=>u.id!==id&&u.username===rec.username))return formErr(f,'That username is already taken.');
    if(rec.role==='admin')rec.unitId=null;
    else if(!rec.unitId||!DB.units.find(u=>u.id===rec.unitId&&u.active))return formErr(f,'Choose a unit for this role.');
    if(id){
      const u=DB.users.find(x=>x.id===id);
      if(u.role==='admin'&&rec.role!=='admin'&&DB.users.filter(x=>x.active&&x.role==='admin').length<2)return formErr(f,'Keep at least one executive account.');
      Object.assign(u,rec);if(u.id===ME.id)ME=u;
    }else{
      const pw=String(d.get('password')||'');if(pw.length<8)return formErr(f,'The password needs at least 8 characters.');
      const salt=uid('s');
      DB.users.push(Object.assign({id:uid('u'),salt,pw:await hashPw(pw,salt),active:true},rec));
    }
    persist();closeModal();toast(id?'Changes saved':'Person added','ok');draw(false);
  },
  'person-pw':async f=>{
    if(!needRole('admin'))return;
    const u=DB.users.find(x=>x.id===f.dataset.id),pw=String(new FormData(f).get('password')||'');
    if(pw.length<8)return formErr(f,'The password needs at least 8 characters.');
    u.salt=uid('s');u.pw=await hashPw(pw,u.salt);persist();closeModal();toast('Password reset','ok');
  },
  'account-pw':async f=>{
    const d=new FormData(f),cur=String(d.get('current')||''),pw=String(d.get('password')||''),again=String(d.get('again')||'');
    if(await hashPw(cur,ME.salt)!==ME.pw)return formErr(f,'The current password is not correct.');
    if(pw.length<8)return formErr(f,'The new password needs at least 8 characters.');
    if(pw!==again)return formErr(f,'The two new passwords do not match.');
    ME.salt=uid('s');ME.pw=await hashPw(pw,ME.salt);persist();closeModal();toast('Password changed','ok');
  }
};
const CHG={
  'review-user':el=>{if(ME.role!=='head')return;UI.reviewUser=el.value;draw(false)},
  cmd:el=>{if(!needRole('admin'))return;UI.cmd[el.dataset.side][el.dataset.field]=el.value;draw(false)},
  'people-filter':el=>{UI[el.dataset.f]=el.value;draw(false)},
  'exec-tab':el=>{if(!needRole('admin'))return;UI.execTab=el.value;draw(false)},
  'uw-unit':el=>{if(!needRole('admin'))return;UI.uw.unitId=el.value;UI.uw.userId='';draw(false)},
  'uw-user':el=>{if(!needRole('admin'))return;UI.uw.userId=el.value;draw(false)}
};

document.addEventListener('click',e=>{
  if(!e.target.closest('.menu-wrap'))$$('.menu-wrap.open').forEach(x=>x.classList.remove('open'));
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el)}
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&CHG[el.dataset.change])CHG[el.dataset.change](el)});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-live]');if(!el)return;
  UI.q=el.value;const pos=el.selectionStart;draw(false);
  const n=$('#pq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;
  e.preventDefault();
  const fn=F[f.dataset.form];if(!fn)return;
  const er=f.querySelector('.form-err');if(er)er.textContent='';
  Promise.resolve(fn(f)).catch(err=>{console.error(err);toast('Something went wrong. Try again.','bad')});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
let rz=null;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(paintCharts,120)});

/* ----- start ----- */
function bootFromLocal(){
  const raw=lsGet(KEY);
  if(raw){try{DB=JSON.parse(raw)}catch(e){DB=null}}
}
function resumeSession(){
  const sid=ssGet(SKEY);
  if(sid){const u=DB.users.find(x=>x.id===sid&&x.active);if(u){ME=u;UI.route=HOME[u.role];UI.week=curWeek();resetIdle()}}
}
(async function init(){
  try{
    const cloudUp=await initCloud();
    if(cloudUp){
      bootFromLocal(); // show the last-known copy instantly while the cloud snapshot loads
      if(DB&&DB.users&&DB.v===1){resumeSession();draw(true)}
      watchCloud(async remote=>{
        if(remote&&remote.users&&remote.v===1){
          DB=remote;lsSet(KEY,JSON.stringify(DB));
        }else if(!DB||!DB.users||DB.v!==1){
          DB=await buildSeed();pushCloud();
        }
        resumeSession();draw(true);
      });
    }else{
      bootFromLocal();
      if(!DB||!DB.users||DB.v!==1){DB=await buildSeed();persist()}
      resumeSession();
      draw(true);
    }
  }catch(e){console.error(e);setSync('err','Could not start cloud sync — running locally');if(!DB||!DB.users||DB.v!==1){DB=await buildSeed()}resumeSession();draw(true)}
})();
</script>
